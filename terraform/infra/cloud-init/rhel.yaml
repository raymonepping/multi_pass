#cloud-config

# Multipass injects Ubuntu-specific vendor-data that installs pollinate.
# RHEL does not provide it, so mark only that module complete before final stage.
bootcmd:
  - [touch, /var/lib/cloud/instance/sem/config_package_update_upgrade_install]

package_update: false
package_upgrade: false

# Inject the operator's public key so Ansible can reach the node directly
# without going through `multipass exec`. Add additional keys as needed.
ssh_authorized_keys:
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIO7sYVTsOkIx4spTQc/I+DSNuuqf2tnU4j1hA4Mkj3r/ repping@gmail.com
