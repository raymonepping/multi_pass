[defaults]
inventory              = ansible/inventory/terraform.py
roles_path             = ansible/roles
collections_paths      = ~/.ansible/collections
host_key_checking      = False
# Use the built-in default callback with yaml output (community.general.yaml
# was removed in community.general 12.0.0)
stdout_callback        = ansible.builtin.default
result_format          = yaml
callbacks_enabled      = profile_tasks
interpreter_python     = /usr/bin/python3.9

[privilege_escalation]
become       = True
become_method = sudo

[ssh_connection]
pipelining   = True
# -F /dev/null bypasses ~/.ssh/config which contains macOS-only UseKeychain
# directives that Ansible's bundled ssh does not understand.
ssh_args     = -F /dev/null -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
