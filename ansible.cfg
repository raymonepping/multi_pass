[defaults]
inventory              = ansible/inventory/localhost.yml
roles_path             = ansible/roles
collections_path       = .cache/ansible/collections:~/.ansible/collections:/usr/share/ansible/collections
local_tmp              = .cache/ansible/tmp
host_key_checking      = True
# Use the built-in default callback with yaml output (community.general.yaml
# was removed in community.general 12.0.0)
stdout_callback        = ansible.builtin.default
result_format          = yaml
callbacks_enabled      = profile_tasks
interpreter_python     = /usr/bin/python3.9

[privilege_escalation]
become       = True
become_method = sudo

[ssh_connection]
pipelining   = True
# The inventory supplies a dedicated identity and known_hosts file. Bypass the
# user's SSH config so macOS-only UseKeychain settings cannot break automation.
ssh_args     = -F /dev/null -o IdentitiesOnly=yes -o ControlMaster=auto -o ControlPersist=60s
