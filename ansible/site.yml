---
# site.yml — full Vault cluster bootstrap playbook
#
# Usage:
#   make ansible-converge
#
# Run individual phases with tags:
#   ansible-playbook ... --tags tls
#   ansible-playbook ... --tags install
#   ansible-playbook ... --tags license
#   ansible-playbook ... --tags configure
#   ansible-playbook ... --tags bootstrap

- name: Phase 2 — RHEL and Vault convergence
  hosts: vault
  gather_facts: true
  serial: "100%"

  roles:
    - role: rhel_prepare
      tags: rhel

    - role: vault_install
      tags: install

    - role: tls
      tags: tls

    - role: vault_license
      tags: license

    - role: vault_configure
      tags: configure

    - role: vault_bootstrap
      tags: bootstrap

    - role: vault_validate
      tags: validate
