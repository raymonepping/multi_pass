---
# site.yml — full Vault cluster bootstrap playbook
#
# Usage:
#   ansible-playbook -i ansible/inventory/terraform.py ansible/site.yml
#
# Run individual phases with tags:
#   ansible-playbook ... --tags tls
#   ansible-playbook ... --tags install
#   ansible-playbook ... --tags license
#   ansible-playbook ... --tags configure
#   ansible-playbook ... --tags bootstrap

- name: Phase 2 — OS and Vault bootstrap
  hosts: vault
  gather_facts: true
  serial: "100%"   # all nodes in parallel except where roles use run_once / delegate_to

  roles:
    - role: tls
      tags: tls

    - role: vault_install
      tags: install

    - role: vault_license
      tags: license

    - role: vault_configure
      tags: configure

    - role: vault_bootstrap
      tags: bootstrap
