---
- name: Read seal status for {{ vault_target }}
  ansible.builtin.uri:
    url: "https://{{ hostvars[vault_target].ansible_host }}:8200/v1/sys/seal-status"
    ca_path: "{{ tls_dir }}/ca.crt"
    return_content: true
    status_code: 200
  register: target_seal_status
  until: target_seal_status.status == 200
  retries: 30
  delay: 2
  delegate_to: localhost
  become: false

- name: Submit the threshold number of unseal keys to {{ vault_target }}
  ansible.builtin.uri:
    url: "https://{{ hostvars[vault_target].ansible_host }}:8200/v1/sys/unseal"
    ca_path: "{{ tls_dir }}/ca.crt"
    method: PUT
    body_format: json
    body:
      key: "{{ vault_init.unseal_keys_b64[item] }}"
    status_code: 200
  loop: "{{ range(0, key_threshold | int) | list }}"
  no_log: true
  delegate_to: localhost
  become: false
  when: target_seal_status.json.sealed

- name: Require {{ vault_target }} to remain unsealed
  ansible.builtin.uri:
    url: "https://{{ hostvars[vault_target].ansible_host }}:8200/v1/sys/seal-status"
    ca_path: "{{ tls_dir }}/ca.crt"
    return_content: true
    status_code: 200
  register: target_unsealed
  until: not target_unsealed.json.sealed
  retries: 10
  delay: 3
  delegate_to: localhost
  become: false
