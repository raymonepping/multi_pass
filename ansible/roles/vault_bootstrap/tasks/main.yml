---
- name: Define controller-side Vault artifact paths
  ansible.builtin.set_fact:
    vault_init_path: "{{ secrets_dir }}/vault-init.json"
    vault_platform_token_path: "{{ secrets_dir }}/platform-token"
  no_log: true
  run_once: true

- name: Ensure the controller secrets directory exists
  ansible.builtin.file:
    path: "{{ secrets_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  run_once: true

- name: Wait for the leader seal-status endpoint
  ansible.builtin.uri:
    url: "https://{{ hostvars[vault_leader].ansible_host }}:8200/v1/sys/seal-status"
    ca_path: "{{ tls_dir }}/ca.crt"
    return_content: true
    status_code: 200
  register: leader_seal_status
  until: leader_seal_status.status == 200
  retries: 30
  delay: 2
  delegate_to: localhost
  become: false
  run_once: true

- name: Check for existing controller initialization material
  ansible.builtin.stat:
    path: "{{ vault_init_path }}"
  register: local_init_file
  delegate_to: localhost
  become: false
  run_once: true

- name: Protect initialized Vault from lost recovery material
  ansible.builtin.assert:
    that:
      - not leader_seal_status.json.initialized or local_init_file.stat.exists
      - leader_seal_status.json.initialized or not local_init_file.stat.exists
    fail_msg: >-
      Vault initialization state conflicts with .secrets/vault-init.json.
      Restore the correct recovery material; it will never be overwritten.
  run_once: true

- name: Initialize vault-1 exactly once
  ansible.builtin.uri:
    url: "https://{{ hostvars[vault_leader].ansible_host }}:8200/v1/sys/init"
    ca_path: "{{ tls_dir }}/ca.crt"
    method: PUT
    body_format: json
    body:
      secret_shares: "{{ key_shares | int }}"
      secret_threshold: "{{ key_threshold | int }}"
    return_content: true
    status_code: 200
  register: vault_init_result
  no_log: true
  delegate_to: localhost
  become: false
  run_once: true
  when: not leader_seal_status.json.initialized

- name: Persist initialization material on the controller
  ansible.builtin.copy:
    content: "{{ vault_init_result.json | to_nice_json }}"
    dest: "{{ vault_init_path }}"
    mode: "0600"
  no_log: true
  delegate_to: localhost
  become: false
  run_once: true
  when: not leader_seal_status.json.initialized

- name: Load initialization material from the controller
  ansible.builtin.slurp:
    src: "{{ vault_init_path }}"
  register: vault_init_raw
  no_log: true
  delegate_to: localhost
  become: false
  run_once: true

- name: Parse initialization material in memory
  ansible.builtin.set_fact:
    vault_init: "{{ vault_init_raw.content | b64decode | from_json }}"
  no_log: true
  run_once: true

- name: Unseal the leader when required
  ansible.builtin.include_tasks: unseal.yml
  vars:
    vault_target: "{{ vault_leader }}"
  run_once: true

- name: Join and unseal each follower
  ansible.builtin.include_tasks: follower.yml
  loop: "{{ groups['vault'] | difference([vault_leader]) | sort }}"
  loop_control:
    loop_var: vault_target
  run_once: true

- name: Upload the lab platform-admin policy
  ansible.builtin.uri:
    url: "https://{{ hostvars[vault_leader].ansible_host }}:8200/v1/sys/policies/acl/lab-platform-admin"
    ca_path: "{{ tls_dir }}/ca.crt"
    method: PUT
    headers:
      X-Vault-Token: "{{ vault_init.root_token }}"
    body_format: json
    body:
      policy: "{{ lookup('file', playbook_dir + '/../policies/platform-admin.hcl') }}"
    status_code: 204
  no_log: true
  delegate_to: localhost
  become: false
  run_once: true

- name: Check for an existing platform token file
  ansible.builtin.stat:
    path: "{{ vault_platform_token_path }}"
  register: platform_token_file
  delegate_to: localhost
  become: false
  run_once: true

- name: Load the existing platform token
  ansible.builtin.slurp:
    src: "{{ vault_platform_token_path }}"
  register: platform_token_raw
  no_log: true
  delegate_to: localhost
  become: false
  run_once: true
  when: platform_token_file.stat.exists

- name: Check whether the existing platform token remains valid
  ansible.builtin.uri:
    url: "https://{{ hostvars[vault_leader].ansible_host }}:8200/v1/auth/token/lookup-self"
    ca_path: "{{ tls_dir }}/ca.crt"
    headers:
      X-Vault-Token: "{{ platform_token_raw.content | b64decode }}"
    status_code: [200, 403]
  register: platform_token_check
  no_log: true
  delegate_to: localhost
  become: false
  run_once: true
  when: platform_token_file.stat.exists

- name: Create a renewable orphan platform token when needed
  ansible.builtin.uri:
    url: "https://{{ hostvars[vault_leader].ansible_host }}:8200/v1/auth/token/create"
    ca_path: "{{ tls_dir }}/ca.crt"
    method: PUT
    headers:
      X-Vault-Token: "{{ vault_init.root_token }}"
    body_format: json
    body:
      policies: [lab-platform-admin]
      period: 24h
      no_parent: true
      display_name: lab-platform-admin
    return_content: true
    status_code: 200
  register: new_platform_token
  no_log: true
  delegate_to: localhost
  become: false
  run_once: true
  when: not platform_token_file.stat.exists or platform_token_check.status | default(403) == 403

- name: Persist a newly created platform token
  ansible.builtin.copy:
    content: "{{ new_platform_token.json.auth.client_token }}"
    dest: "{{ vault_platform_token_path }}"
    mode: "0600"
  no_log: true
  delegate_to: localhost
  become: false
  run_once: true
  when: new_platform_token is not skipped

- name: Verify three Raft voters
  ansible.builtin.uri:
    url: "https://{{ hostvars[vault_leader].ansible_host }}:8200/v1/sys/storage/raft/configuration"
    ca_path: "{{ tls_dir }}/ca.crt"
    headers:
      X-Vault-Token: "{{ vault_init.root_token }}"
    return_content: true
    status_code: 200
  register: raft_configuration
  no_log: true
  delegate_to: localhost
  become: false
  run_once: true
  failed_when: >-
    (raft_configuration.json.data.config.servers |
    selectattr('voter', 'equalto', true) | list | length) != 3
